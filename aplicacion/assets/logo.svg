<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Logo de la app del participante. Reproducido del diseño en Figma
       (archivo VXFnbiXKzb0Hj92s2r2ulL, pantalla de acceso): insignia circular
       con degradado suave y una gota con la punta hacia arriba, una gota
       blanca dentro y un punto en el centro. -->
  <defs>
    <radialGradient id="fondo" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#F5F6DC"/>
      <stop offset="0.55" stop-color="#EAF3EA"/>
      <stop offset="1" stop-color="#DDEFEA"/>
    </radialGradient>
    <linearGradient id="gota" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1B776C"/>
      <stop offset="1" stop-color="#3B9E8F"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31.25" fill="url(#fondo)" stroke="#FFFFFF" stroke-width="1.5"/>
  <path fill="url(#gota)"
        d="M32 7 C 40.5 19, 48 27.5, 48 38 A 16 16 0 1 1 16 38 C 16 27.5, 23.5 19, 32 7 Z"/>
  <path fill="#FBFBF8"
        d="M32 17.5 C 36.6 25, 39.5 31, 39.5 40 A 7.5 7.5 0 1 1 24.5 40 C 24.5 31, 27.4 25, 32 17.5 Z"/>
  <circle cx="32" cy="35.5" r="2.7" fill="#22867A"/>
</svg>
